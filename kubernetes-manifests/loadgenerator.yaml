# Deployment definitionapi
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  labels:
      tags.datadoghq.com/env: "prod"
      tags.datadoghq.com/service: "loadgenerator"
      tags.datadoghq.com/version: "1.0"
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for frontend at ${FRONTEND_ADDR}..."
          until wget -q -T 2 -O /dev/null "http://${FRONTEND_ADDR}"; do
            echo "frontend not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "Frontend is reachable — starting load generator."
        name: frontend-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - all
          privileged: false
          readOnlyRootFilesystem: true
        image: busybox:latest
        env:
        - name: FRONTEND_ADDR
          value: "frontend:80"
      containers:
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - all
          privileged: false
          readOnlyRootFilesystem: true
        image: ghcr.io/ricardoreaddog/loadgenerator:sandbox
        imagePullPolicy: Always
        env:
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/env']
        - name: DD_SERVICE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/service']
        - name: DD_VERSION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['tags.datadoghq.com/version']
        - name: DD_TRACE_AGENT_URL
          value: "unix:///var/run/datadog/apm.socket"
        - name: FRONTEND_ADDR
          value: "frontend:80"
        - name: USERS
          value: "10"
        volumeMounts:
        - name: apmsocketpath
          mountPath: /var/run/datadog 
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
        - hostPath:
            path: /var/run/datadog/
          name: apmsocketpath
